[package]
name = "native-isp-cockpit"
version = "0.1.3"
description = "Local flagship telemetry cockpit and menu bar HUD for native-isp-vps"
authors = ["luvio-arlan"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "native_isp_cockpit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "process", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls", "http2"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
semver = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSStatusItem",
  "NSStatusBarButton",
  "NSButton",
  "NSControl",
  "NSFont",
  "NSFontDescriptor",
  "NSText",
  "objc2-core-foundation",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
