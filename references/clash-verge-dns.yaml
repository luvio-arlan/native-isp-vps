# Clash Verge Rev 防 DNS 污染 / 防 IPv6 泄露优化配置模板（dns_config.yaml）
# 适用场景：国内网络开启 TUN 模式使用原生双 ISP 节点（重点防止 t.co / Google / Claude 触发国内 IPv6 DNS 污染或泄露）
#
# 搭配要求（Clash Verge Rev → 设置）：
# 1. Clash 设置 → 关闭 IPv6（ipv6: false），开启「DNS 覆写」
# 2. 虚拟网卡模式（TUN）设置 → 开启「严格路由（strict-route: true）」，协议栈锁定为「Mixed」（切勿选 Mips）
# 3. TUN dns-hijack 同时包含 any:53 与 tcp://any:53
#
# 性能说明：
# - 海外域名：Fake-IP 本机 <1ms 秒返 198.18.x.x，域名直接交给海外 VPS 远程解析（更快且 0 泄露）
# - 国内域名：通过 nameserver-policy & direct-nameserver 走阿里/腾讯加密 DoH，精准命中国内最近 CDN，不减速

dns:
  enable: true
  ipv6: false
  listen: :53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  cache-algorithm: arc
  prefer-h3: false
  respect-rules: true
  use-hosts: false
  use-system-hosts: false
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - '*.localdomain'
  - '*.home.arpa'
  - '*.arpa'
  - time.*.com
  - ntp.*.com
  - +.market.xiaomi.com
  - localhost.ptlogin2.qq.com
  - localhost.sec.qq.com
  - '*.msftncsi.com'
  - '*.msftconnecttest.com'
  - +.stun.*.*
  - +.stun.*.*.*
  - +.push.apple.com
  - '*.mcdn.bilivideo.cn'
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  direct-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  direct-nameserver-follow-policy: false
  nameserver:
  - https://cloudflare-dns.com/dns-query
  - https://dns.google/dns-query
  nameserver-policy:
    'geosite:cn,private':
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback: []
hosts: {}
