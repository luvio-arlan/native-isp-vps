# Clash Verge Rev 订阅扩展合并配置模板（Merge.yaml，适用于 Mihomo v1.19+）
# 作用：在每次刷新 3x-ui 订阅后自动注入全局并发建连、TCP 保活与域名嗅探，全场景显著降低首包等待与 Wi-Fi/5G 切换假死。
#
# 使用方式：
# 粘贴到 Clash Verge Rev 对应订阅右键 → 「编辑扩展配置（Merge）」中并保存即可，永久防订阅刷新覆盖。

# 开启并发 TCP 拨号（Happy Eyeballs）：解析出多个 IP 时并发连接取最快，明显加快海外网页与 AI API 响应
tcp-concurrent: true

# 全局 TCP 保活（单位：秒）：15s 探测一次，快速感知 Wi-Fi/公司网/5G NAT 老化或切换并重建死连接，告别“卡住转圈 30 秒”
keep-alive-idle: 15
keep-alive-interval: 15

# 统一 TLS 客户端指纹，降低特征暴露
global-client-fingerprint: chrome

# 规则模板不含 PROCESS-NAME 规则，关闭进程反查避免 macOS 每条新建连接触发内核进程查询开销（若自定义了进程规则可改回 strict）
find-process-mode: off

# 域名嗅探（Sniffer）：精准还原直接用 IP 建连的 App 真实目标域名，确保 AI 防泄露与国内直连规则 100% 命中
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - Mijia Cloud
    - +.push.apple.com
