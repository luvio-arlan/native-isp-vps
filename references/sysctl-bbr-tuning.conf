# /etc/sysctl.d/99-vps-tuning.conf
# 跨太平洋高稳定性 TCP 内核调优（适配 512MB–1GB+ 小内存 VPS）
# 生效命令：
#   sysctl --system
#   tc qdisc replace dev $(ip route show default | awk '/default/ {print $5; exit}') root fq

# 1. BBR 拥塞控制 + FQ 公平队列
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# 2. 小内存友好缓冲（16MB 上限；2GB+ 千兆口机可升至 33554432）
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.optmem_max = 65536
net.core.netdev_max_backlog = 16384
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 131072 16777216

# 3. 抗断流、抗 NAT 静默老化与低交互延迟
net.ipv4.tcp_notsent_lowat = 16384
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_fastopen = 0
net.ipv4.tcp_ecn = 0
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_keepalive_time = 120
net.ipv4.tcp_keepalive_intvl = 15
net.ipv4.tcp_keepalive_probes = 4

# 4. 连接跟踪扩容 & 低 Swap 倾向
net.netfilter.nf_conntrack_max = 131072
vm.swappiness = 10
